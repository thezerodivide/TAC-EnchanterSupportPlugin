name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  tests:
    name: Syntax check and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LuaJIT and Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y luajit lua5.1

      - name: Bytecode-compile the plugin and the tests
        run: |
          for f in mez.lua tests/run.lua tests/test_decision.lua tests/test_collection.lua; do
            luajit -bl "$f" > /dev/null
            luac -p "$f"
          done

      - name: Unit tests
        run: luajit tests/run.lua

      - name: Every deliberate rule break is caught
        run: python3 tools/mutation_check.py
